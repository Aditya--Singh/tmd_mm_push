[project]
name = "bank-news-ai"
version = "0.1.0"
description = "AI-powered banking news aggregation and summarization"
readme = "README.md"
authors = [
    { email = "singh.aditya90@gmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "beautifulsoup4",
    "lxml",
    "loguru",
    "langchain",
    "langchain-community",
    "langchain-core",
    "ollama",
    "apscheduler",
    "pydantic-settings>=2.14.2",
    "alembic>=1.19.0",
    "bcrypt",
    "python-jose",
    # Used to reach Peer Benchmarking from the server, for the sign-in
    # ticket and for its navigation.
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "black",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
# The application package lives in the backend directory, so it has to be
# importable from the tests regardless of how pytest is invoked.
pythonpath = ["."]
testpaths = ["tests"]
